<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexSite AI - Vanilla</title>
    <link rel="stylesheet" href="style.css">
    <link id="dynamic-font" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>NexSite AI (Vanilla)</h2>
            <div class="api-key-container">
                <input type="password" id="api-key-input" placeholder="Enter Gemini API Key">
            </div>
            
            <div class="chat-container" id="chat-history">
                <div class="message system">Welcome! Describe the website you want to build.</div>
            </div>
            
            <div class="input-container">
                <textarea id="prompt-input" placeholder="e.g. Create a dark themed pricing page..."></textarea>
                <button id="generate-btn">Generate</button>
            </div>
        </aside>

        <!-- Main Preview Area -->
        <main class="preview-area" id="website-preview">
            <div id="dynamic-content">
                <!-- AI Generated Sections Will Mount Here -->
            </div>
        </main>
    </div>

    <!-- Script imports -->
    <script type="module" src="app.js"></script>
</body>
</html>
